<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream Big, Little Boy! — Interactive Storybook</title>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 16px;
    }
    #lock-screen {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
    }
    #lock-screen h1 { font-size: 1.4rem; margin-bottom: 8px; color: #fbbf24; }
    #lock-screen p { font-size: 0.92rem; color: #cbd5e1; margin-bottom: 20px; }
    #password-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 12px;
      text-align: center;
    }
    #unlock-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #f59e0b;
      color: #0f172a;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    #unlock-btn:hover { background: #fbbf24; }
    #error-msg { color: #f87171; font-size: 0.85rem; margin-top: 10px; display: none; }

    #book-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1000px;
    }
    .header-bar {
      text-align: center;
      margin-bottom: 12px;
    }
    .header-bar h2 { font-size: 1.2rem; color: #fbbf24; }
    .header-bar span { font-size: 0.85rem; color: #94a3b8; }

    #flipbook {
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      overflow: hidden;
    }
    .page {
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
    }
    .nav-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #334155;
      color: #f8fafc;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn:hover { background: #475569; }
    #page-indicator { font-size: 0.95rem; color: #e2e8f0; min-width: 110px; text-align: center; }
  </style>
</head>
<body>

  <div id="lock-screen">
    <h1>Dream Big, Little Boy!</h1>
    <p>Enter your reader access code to open the interactive storybook.</p>
    <input type="password" id="password-input" placeholder="Enter access password" />
    <button id="unlock-btn" onclick="unlockBook()">Open Storybook</button>
    <div id="error-msg">Incorrect password. Please try again.</div>
  </div>

  <div id="book-wrapper">
    <div class="header-bar">
      <h2>Dream Big, Little Boy!</h2>
      <span>Click or swipe corners to flip pages</span>
    </div>
    <div id="flipbook"></div>
    <div class="controls">
      <button class="nav-btn" id="prev-btn">◀ Prev</button>
      <span id="page-indicator">Page 1 / 15</span>
      <button class="nav-btn" id="next-btn">Next ▶</button>
    </div>
  </div>

  <script>
    const ACCESS_PASSWORD = "DezEbook2026";
    const TOTAL_PAGES = 15;
    let pageFlip = null;

    document.getElementById("password-input").addEventListener("keypress", function(e) {
      if (e.key === "Enter") unlockBook();
    });

    function unlockBook() {
      const input = document.getElementById("password-input").value.trim();
      if (input === ACCESS_PASSWORD) {
        document.getElementById("lock-screen").style.display = "none";
        document.getElementById("book-wrapper").style.display = "flex";
        initFlipbook();
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }

    function initFlipbook() {
      const container = document.getElementById("flipbook");
      for (let i = 1; i <= TOTAL_PAGES; i++) {
        const pageDiv = document.createElement("div");
        pageDiv.className = "page";
        if (i === 1 || i === TOTAL_PAGES) pageDiv.setAttribute("data-density", "hard");
        const img = document.createElement("img");
        img.src = i + ".png";
        img.alt = "Page " + i;
        pageDiv.appendChild(img);
        container.appendChild(pageDiv);
      }

      const isMobile = window.innerWidth < 768;
      pageFlip = new St.PageFlip(container, {
        width: isMobile ? 340 : 450,
        height: isMobile ? 480 : 636,
        size: "stretch",
        minWidth: 280,
        maxWidth: 550,
        minHeight: 400,
        maxHeight: 780,
        showCover: true,
        usePortrait: isMobile,
        mobileScrollSupport: false
      });

      pageFlip.loadFromHTML(document.querySelectorAll(".page"));

      pageFlip.on("flip", (e) => {
        document.getElementById("page-indicator").textContent =
          "Page " + (e.data + 1) + " / " + TOTAL_PAGES;
      });

      document.getElementById("prev-btn").onclick = () => pageFlip.flipPrev();
      document.getElementById("next-btn").onclick = () => pageFlip.flipNext();
    }
  </script>
</body>
</html>
